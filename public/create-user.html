<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create User</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #222;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #666;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1473e6;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #0d66d0;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e9f7ef;
      border: 1px solid #b7e4c7;
      color: #1e6b3a;
    }

    .error {
      display: block;
      background: #fdecec;
      border: 1px solid #f3b5b5;
      color: #a12626;
    }

    .user-id {
      margin-top: 8px;
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create User</h1>

    <p class="subtitle">
      Create a user in Auth0 and automatically create their AEP profile.
    </p>

    <form id="createUserForm">

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          required
        />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          minlength="8"
          required
        />
      </div>

      <button type="submit" id="submitButton">
        Create User
      </button>

    </form>

    <div id="message" class="message"></div>

  </div>


  <script>
    const form = document.getElementById("createUserForm");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const firstName =
        document.getElementById("firstName").value.trim();

      const lastName =
        document.getElementById("lastName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      // Validate passwords
      if (password !== confirmPassword) {
        message.className = "message error";
        message.textContent = "Passwords do not match.";
        return;
      }


      submitButton.disabled = true;
      submitButton.textContent = "Creating user...";


      try {

        const response = await fetch("/api/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            password
          })
        });


        const data = await response.json();


        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Unable to create user."
          );
        }


        message.className = "message success";

        message.innerHTML = `
          <strong>User created successfully.</strong>
          <div class="user-id">
            Auth0 User ID: ${escapeHtml(data.user.userId)}
          </div>
          <div>
            AEP profile created successfully.
          </div>
        `;


        form.reset();

      } catch (error) {

        console.error(error);

        message.className = "message error";
        message.textContent = error.message;

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Create User";

      }
    });


    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
